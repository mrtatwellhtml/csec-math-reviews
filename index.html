<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fifth Form Mathematics Review</title>
<meta name="description" content="Interactive CSEC Mathematics review pages, grouped by topic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a single column index. Header, search + topic filter, then one section per topic folder with a grid of page cards. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f5f8fb; --line:#d6dee7; --text:#18222e; --muted:#5a6878;
  --navy:#1c3557; --navy-ink:#ffffff; --accent:#c8302c; --chip:#e6edf5;
  --f-display:"Spectral","Times New Roman",Georgia,serif;
  --f-ui:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e141a; --surface:#151d26; --surface-2:#1a2430; --line:#2a3644; --text:#e6edf4; --muted:#97a6b6;
  --navy:#2a4f7c; --navy-ink:#ffffff; --accent:#ff6b62; --chip:#1f2a36; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:16px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 48px}
header{padding:40px 0 22px;border-bottom:3px double var(--line);margin-bottom:22px}
.kicker{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--f-display);font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:6px 0 8px;text-wrap:balance}
.lede{color:var(--muted);max-width:62ch;margin:0}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:24px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search svg{width:18px;height:18px;fill:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;font:inherit;color:inherit;padding:11px 0;width:100%}
.search:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px color-mix(in srgb,var(--navy) 20%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.chip:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{margin-bottom:30px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.sechead h2{font-family:var(--f-display);font-size:1.5rem;margin:0}
.sechead .count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;color:inherit;text-decoration:none;min-width:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--navy);transform:translateY(-2px)}
.card .topic{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.card h3{font-family:var(--f-display);font-size:1.2rem;line-height:1.25;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .go{margin-top:auto;padding-top:6px;font-weight:600;font-size:.9rem;color:var(--navy)}
@media (prefers-color-scheme: dark){.card .go{color:#9cc1ff}}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted)}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion: reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">CSEC Mathematics · Fifth Form</div>
    <h1>Mathematics Review</h1>
    <p class="lede">Interactive review pages for each topic. Choose a topic, open a page and work through it at your own pace.</p>
  </header>

  <div class="tools">
    <label class="search" for="q"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 1 0 4.2 12.6l5.1 5.1 1.4-1.4-5.1-5.1A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg><input id="q" type="search" placeholder="Search pages, e.g. bisect, angle, triangle" autocomplete="off"></label>
    <div class="chips" id="chips" role="group" aria-label="Filter by topic"></div>
  </div>

  <main id="list"><p class="note">Loading pages…</p></main>

  <footer>This list updates automatically whenever a new page is added. <span id="stamp"></span></footer>
</div>

<!-- The site builder (Jekyll on GitHub Pages) fills this list with every .html file inside the topics folder. -->
<script>window.PAGES=[];{% for f in site.static_files %}{% if f.extname == ".html" and f.path contains "/topics/" %}window.PAGES.push({{ f.path | jsonify }});{% endif %}{% endfor %}</script>

<script>
(function(){
"use strict";
var listEl=document.getElementById("list"),chipsEl=document.getElementById("chips"),qEl=document.getElementById("q");
var items=[],active="All";

function pretty(s){return s.replace(/\.html?$/i,"").replace(/^\d+[\s._-]*/,"").replace(/[-_]+/g," ").replace(/\s+/g," ").trim().replace(/^./,function(c){return c.toUpperCase();});}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function fromPaths(paths){
  return paths.map(function(p){
    p=p.replace(/^\/+/,"");
    var parts=p.split("/");            // topics/<Folder>/<file>.html  or topics/<file>.html
    var folder=parts.length>2?parts[1]:"General";
    var file=parts[parts.length-1];
    return {href:p.split("/").map(encodeURIComponent).join("/"),path:p,folder:folder,topic:pretty(folder),title:pretty(file),file:file,desc:"",order:9999};
  }).sort(function(a,b){return a.folder.localeCompare(b.folder,undefined,{numeric:true})||a.file.localeCompare(b.file,undefined,{numeric:true});});
}

function cacheGet(k){try{var v=JSON.parse(localStorage.getItem(k)||"null");if(v&&Date.now()-v.t<864e5)return v.d;}catch(e){}return null;}
function cacheSet(k,d){try{localStorage.setItem(k,JSON.stringify({t:Date.now(),d:d}));}catch(e){}}

// Read each page's <title>, description and optional review-topic / review-order tags.
function enrich(it){
  var key="review-meta:"+it.path,c=cacheGet(key);
  if(c){apply(it,c);return Promise.resolve();}
  return fetch(it.href).then(function(r){return r.ok?r.text():"";}).then(function(html){
    var head=html.slice(0,20000);var d=new DOMParser().parseFromString(head,"text/html");
    var meta=function(n){var m=d.querySelector('meta[name="'+n+'"]');return m?m.getAttribute("content")||"":"";};
    var t=d.querySelector("title");
    var m={title:t?t.textContent.trim():"",desc:meta("description"),topic:meta("review-topic"),order:meta("review-order")};
    cacheSet(key,m);apply(it,m);
  }).catch(function(){});
}
function apply(it,m){if(m.title)it.title=m.title;if(m.desc)it.desc=m.desc;if(m.topic)it.topic=m.topic;if(m.order&&!isNaN(+m.order))it.order=+m.order;}

function render(){
  var q=qEl.value.trim().toLowerCase();
  var topics=[];items.forEach(function(it){if(topics.indexOf(it.topic)<0)topics.push(it.topic);});
  chipsEl.innerHTML=["All"].concat(topics).map(function(t){return '<button class="chip" type="button" aria-pressed="'+(t===active)+'" data-t="'+esc(t)+'">'+esc(t)+'</button>';}).join("");
  var shown=items.filter(function(it){return (active==="All"||it.topic===active)&&(!q||(it.title+" "+it.desc+" "+it.topic).toLowerCase().indexOf(q)>=0);});
  if(!items.length){listEl.innerHTML='<p class="note">No pages yet. Pages appear here as soon as they are added to the <b>topics</b> folder.</p>';return;}
  if(!shown.length){listEl.innerHTML='<p class="note">No pages match “'+esc(qEl.value)+'”. Try a shorter word, or choose All.</p>';return;}
  var html="";
  topics.forEach(function(t){
    var g=shown.filter(function(it){return it.topic===t;}).sort(function(a,b){return a.order-b.order||a.file.localeCompare(b.file,undefined,{numeric:true});});
    if(!g.length)return;
    html+='<section><div class="sechead"><h2>'+esc(t)+'</h2><span class="count">'+g.length+(g.length===1?" page":" pages")+'</span></div><div class="grid">'+
      g.map(function(it){return '<a class="card" href="'+it.href+'"><span class="topic">'+esc(it.topic)+'</span><h3>'+esc(it.title)+'</h3>'+(it.desc?'<p>'+esc(it.desc)+'</p>':'')+'<span class="go">Open page →</span></a>';}).join("")+'</div></section>';
  });
  listEl.innerHTML=html;
}
chipsEl.addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;active=b.getAttribute("data-t");render();});
qEl.addEventListener("input",render);

// Fallback when the page is not built by Jekyll: ask GitHub for the file list (works on username.github.io/repo).
function apiList(){
  var host=location.hostname,m=host.match(/^([^.]+)\.github\.io$/);if(!m)return Promise.reject();
  var seg=location.pathname.split("/").filter(Boolean),owner=m[1],repo=seg.length&&!/\.html?$/i.test(seg[0])?seg[0]:host;
  return fetch("https://api.github.com/repos/"+owner+"/"+repo+"/git/trees/HEAD?recursive=1").then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(j){return j.tree.filter(function(n){return n.type==="blob"&&/^topics\/.+\.html?$/i.test(n.path);}).map(function(n){return n.path;});});
}

var start=Array.isArray(window.PAGES)&&window.PAGES.length?Promise.resolve(window.PAGES):apiList().catch(function(){return window.PAGES||[];});
start.then(function(paths){
  items=fromPaths(paths);render();
  return Promise.all(items.map(enrich));
}).then(render).catch(function(){listEl.innerHTML='<p class="note">The page list could not be loaded. Refresh the page to try again.</p>';});
document.getElementById("stamp").textContent="";
})();
</script>
</body>
</html>
